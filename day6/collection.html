<html>
<body>
    <script>
        function addnum(...numbers) {
            let sum= 0;
            for (let n of numbers) {
                sum+=n;
            }
            console.log(sum);
        }
        addnum(10, 20, 30, 40);
        function sum1(name, ...args) {
            console.log(args);
            let total= 0;
            for (let i of args) {
                total+=i;
            }
            console.log("Hello " + name);
            console.log("Total: "+total);
        }
        sum1("World", 10, 20, 30, 40);
    </script>
</body>
</html>
